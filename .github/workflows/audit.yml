name: audit

on:
  push:
    branches: [master]
    paths:
      - "**/Cargo.toml"
      - "**/Cargo.lock"
      - ".github/workflows/audit.yml"
  pull_request:
    paths:
      - "**/Cargo.toml"
      - "**/Cargo.lock"
      - ".github/workflows/audit.yml"
  schedule:
    # Mondays at 12:00 UTC — catches new advisories filed mid-week.
    - cron: "0 12 * * 1"

permissions:
  contents: read
  issues: write
  checks: write

jobs:
  audit:
    name: cargo audit
    # ubuntu-latest, not macos-latest: EmbarkStudios/cargo-deny-action@v2 is a
    # Docker container action and only runs on Linux. cargo-audit / cargo-deny
    # analyze Cargo.lock (platform-agnostic), so Linux is the right home.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Run cargo-deny
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
          # Resolve all optional features so duplicate-dep alerts hidden behind
          # opt-in features still surface. The warn-vs-deny ladder for
          # multiple-versions is governed by deny.toml, not by this flag.
          arguments: --all-features
