name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Check
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --all-targets

  test:
    name: Test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test

  clippy:
    name: Clippy
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-targets -- -D warnings

  fmt:
    name: Format
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --check

  msrv:
    name: MSRV (1.86)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.86"
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --all-targets

  # Linux tripwire: macOS is the primary target, but we compile-check on Linux
  # so PRs can't land code that uses macOS-only APIs without review. Not a
  # full test run — just `cargo check --workspace --all-targets`.
  linux-tripwire:
    name: Linux tripwire (compile-check only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --all-targets

  binary-size-gate:
    name: Binary size gate
    needs: [check]
    runs-on: macos-latest
    env:
      # Default per-phase delta budget. PRs carrying the
      # `binary-size-allow-delta` label may override up to LABEL_OVERRIDE_BUDGET
      # (see "Pick delta budget" step below).
      PHASE_BUDGET: 2MB
      LABEL_OVERRIDE_BUDGET: 5MB
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build release binary
        run: cargo build --release
      # Record the release binary size as a workflow artifact. `size.txt`
      # contains a single integer (bytes) followed by a newline, matching
      # the format of `benchmarks/binary-size-baseline.txt`. `wc -c` is
      # used (not `du -b`) because BSD `du` on macOS-latest runners has
      # no `-b` flag; `wc -c` is portable and reports raw bytes.
      - name: Record release binary size
        run: |
          bytes="$(wc -c < target/release/ghost-complete | tr -d ' ')"
          printf '%s\n' "$bytes" > size.txt
          printf 'Recorded binary size: %s bytes (%.2f MB)\n' \
            "$bytes" "$(awk -v b="$bytes" 'BEGIN { printf "%.2f", b / (1024*1024) }')"
      - name: Upload binary size artifact
        uses: actions/upload-artifact@v4
        with:
          name: ghost-complete-size
          path: size.txt
      # Ceiling raised from 30MB to 110MB in ux-8 to admit the AWS spec.
      # The actual restored-AWS binary is ~102 MB (the SPEC predicted ~40 MB
      # but undercounted: the 418 inlined sub-specs carry ~28 MB of upstream
      # description text, which `include_str!` doubles in __const data).
      # zstd-compressing the embedded specs (separate plan) is the principled
      # reclaim path; this ceiling is the honest measurement plus ~8% headroom.
      - name: Absolute ceiling (110MB)
        run: scripts/check-binary-size.sh --absolute-max 110MB
      # On PR builds, raise the delta budget from PHASE_BUDGET (2MB) to
      # LABEL_OVERRIDE_BUDGET (5MB) when the PR carries the
      # `binary-size-allow-delta` label. The label is the explicit
      # acknowledgement that a PR is expected to grow the binary; without
      # it the strict 2MB delta still applies. Pushes to master always
      # use the strict budget — there is no PR context to read labels from.
      - name: Pick delta budget
        id: budget
        env:
          EVENT_NAME: ${{ github.event_name }}
          LABEL_NAMES: ${{ toJSON(github.event.pull_request.labels.*.name) }}
        run: |
          budget="$PHASE_BUDGET"
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            if printf '%s' "$LABEL_NAMES" | grep -q '"binary-size-allow-delta"'; then
              budget="$LABEL_OVERRIDE_BUDGET"
              printf 'Label `binary-size-allow-delta` found; raising delta budget to %s.\n' "$budget"
            fi
          fi
          printf 'Selected delta budget: %s\n' "$budget"
          printf 'budget=%s\n' "$budget" >> "$GITHUB_OUTPUT"
      - name: Per-phase delta budget
        run: scripts/check-binary-size.sh --delta-max "${{ steps.budget.outputs.budget }}"

  snapshot-diff-gate:
    name: Snapshot diff gate
    needs: [check, binary-size-gate]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Diff specs/__snapshots__
        run: scripts/check-snapshots.sh

  oracle-gate:
    name: Oracle gate (fig-converter)
    needs: [check]
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v6
      - name: Detect changed paths
        id: filter
        uses: dorny/paths-filter@v4
        with:
          filters: |
            fig_converter:
              - 'tools/fig-converter/**'
            spec_priority_audit:
              - 'tools/spec-priority-audit/**'
      - name: Set up Node
        if: steps.filter.outputs.fig_converter == 'true' || steps.filter.outputs.spec_priority_audit == 'true'
        uses: actions/setup-node@v5
        with:
          node-version: "20"
      - name: Install fig-converter dependencies
        if: steps.filter.outputs.fig_converter == 'true'
        run: npm ci
        working-directory: tools/fig-converter
      - name: Run oracle stub
        if: steps.filter.outputs.fig_converter == 'true'
        run: npm run oracle:changed
        working-directory: tools/fig-converter
      - name: Run spec-priority-audit tests
        if: steps.filter.outputs.spec_priority_audit == 'true'
        run: node --test apply.test.mjs
        working-directory: tools/spec-priority-audit

  corpus-hash-gate:
    name: Corpus hash determinism (fig-converter)
    needs: [check]
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v6
      - name: Detect changed paths
        id: filter
        uses: dorny/paths-filter@v4
        with:
          filters: |
            fig_converter:
              - 'tools/fig-converter/**'
              - '.github/workflows/ci.yml'
      - name: Set up Node
        if: steps.filter.outputs.fig_converter == 'true'
        uses: actions/setup-node@v5
        with:
          node-version: "20"
      - name: Install fig-converter dependencies
        if: steps.filter.outputs.fig_converter == 'true'
        run: npm ci
        working-directory: tools/fig-converter
      # Run on a representative subset on PRs: the full corpus runs to
      # several minutes per pass and we'd be running it twice. The 3-spec
      # determinism unit test (src/determinism.test.js, 5 runs each)
      # is included in npm test; this gate exercises the same path across a
      # cross-section of generator shapes (git native generators, docker
      # transform generators, kubectl static spec, brew script generator,
      # cargo native rewrite). Trunk pushes get the full corpus below.
      - name: Determinism check (PR subset)
        if: steps.filter.outputs.fig_converter == 'true'
        run: node tools/fig-converter/scripts/check-corpus-hash.mjs --specs git,docker,kubectl,brew,cargo,make,npm,ls
      - name: Fig-converter tests
        if: steps.filter.outputs.fig_converter == 'true'
        run: npm test
        working-directory: tools/fig-converter

  corpus-hash-gate-master:
    name: Corpus hash determinism (full corpus)
    # Full converter twice across all 709 specs is expensive (several
    # minutes per run). We restrict the full check to trunk pushes so
    # PRs stay snappy — the PR job above runs a representative subset
    # paired with the 3-spec/5-run unit test for correctness.
    if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')
    needs: [check]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: "20"
      - name: Install fig-converter dependencies
        run: npm ci
        working-directory: tools/fig-converter
      - name: Determinism check (full corpus)
        run: node tools/fig-converter/scripts/check-corpus-hash.mjs

  coverage-baseline-drift:
    name: Coverage baseline drift
    # Informational, non-blocking gate. Only runs on main/master branches
    # (pushes to master, or PRs targeting master/main) — feature branches
    # are skipped to keep the signal tied to what's landing on trunk.
    if: github.ref == 'refs/heads/master' || github.base_ref == 'master' || github.ref == 'refs/heads/main' || github.base_ref == 'main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Check coverage baseline drift
        run: scripts/check-coverage-baseline-drift.sh

  coverage-regression:
    name: Coverage regression
    # Coverage regression gate: fails when the unsupported requires_js
    # generator count rises above the baseline by more than the configured
    # tolerance, OR when any command becomes nonfunctional. Wired as
    # `continue-on-error: true` during the initial rollout so a
    # baseline-refresh oversight does not block unrelated work; promotion
    # to a hard gate is a separate follow-up.
    needs: [check]
    runs-on: macos-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build release binary
        run: cargo build --release
      - name: Coverage regression gate
        run: scripts/check-coverage-regression.sh
      - name: Coverage regression gate (self-test)
        run: bash scripts/check-coverage-regression.test.sh
