[package]
name = "gc-suggest"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish = false

[dependencies]
gc-buffer = { path = "../gc-buffer" }
gc-config = { path = "../gc-config" }
gc-jsrt = { path = "../gc-jsrt" }
aws-config = { version = "=1.6.3", default-features = false, features = [
    "behavior-version-latest",
    "rt-tokio",
    "default-https-client",
    "sso",
] }
aws-sdk-iam = { version = "=1.90.0", default-features = false, features = [
    "behavior-version-latest",
    "rt-tokio",
    "default-https-client",
] }
nucleo = "0.5"
tokio = { workspace = true }
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { version = "1", features = ["preserve_order"] }
toml = { workspace = true }
tracing = { workspace = true }
dirs = "6"
regex = "1"
shlex = "1"
tempfile = "3"
unicode-ident = "1"
zstd = { version = "0.13", default-features = false }
sha2 = { workspace = true }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"
filetime = "0.2"
aws-credential-types = "=1.2.14"
aws-smithy-runtime = { version = "=1.11.1", features = ["test-util"] }
aws-smithy-types = "=1.4.7"
http = "1"
criterion = { version = "0.8", features = ["html_reports"] }
proptest = "1"
tokio = { workspace = true, features = ["test-util"] }
tracing-core = { workspace = true }
tracing-subscriber = { workspace = true }

[build-dependencies]
serde_json = "1"
zstd = { version = "0.13", default-features = false }

[[bench]]
name = "suggest_bench"
harness = false
