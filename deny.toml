# cargo-deny configuration (schema v2, cargo-deny >=0.16).
# Run with: cargo deny check
# Targeted subset:   cargo deny check licenses
#                    cargo deny check bans
#                    cargo deny check advisories
#                    cargo deny check sources

[graph]
# Restrict analysis to the targets we actually ship. Avoids flagging
# platform-specific deps (e.g. windows-sys) that we never link.
targets = [
    { triple = "aarch64-apple-darwin" },
    { triple = "x86_64-apple-darwin" },
    { triple = "x86_64-unknown-linux-gnu" }, # Linux CI tripwire
]
all-features = false
no-default-features = false

[output]
feature-depth = 1

# -----------------------------------------------------------------------------
# Licenses
# -----------------------------------------------------------------------------
[licenses]
# SPDX identifiers only; any dep expression outside this set fails the gate.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "MPL-2.0",
    "Zlib",
    # CC0-1.0 is a public-domain dedication (FSF-free).
    # Required by `notify` (pulled in via gc-pty).
    "CC0-1.0",
]
confidence-threshold = 0.93
# Additional private exceptions can be added here per-crate if needed.
exceptions = []

# -----------------------------------------------------------------------------
# Bans / duplicate detection
# -----------------------------------------------------------------------------
[bans]
# Duplicate-version policy: kept at "warn" because `toml_edit v0.22`
# (a direct ghost-complete dep) drags in toml_datetime v0.6 / winnow v0.7
# while the rest of the workspace is on toml v1.x (toml_datetime v1.1 /
# winnow v1.0). Bumping or removing toml_edit is tracked as a follow-up;
# once that lands, flip this to "deny". The aws-* skip-tree below already
# absorbs the smithy hyper/h2/http v0.x/v1.x split that would otherwise
# block the flip.
multiple-versions = "warn"
wildcards = "deny"
# Workspace-internal path deps (e.g. `gc-pty = { path = "../gc-pty" }`) have
# no version and would otherwise be flagged as wildcards.
allow-wildcard-paths = true
highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"

# Crates we never want to depend on (safety rails).
deny = [
    # Add specific crate+version bans here as findings accumulate.
]

# Duplicates we accept today. Revisit whenever upstreams catch up.
skip = []
# AWS smithy is mid-migration between hyper/h2/http v0.x and v1.x across
# the aws-config → aws-smithy-runtime → aws-smithy-http-client chain.
# Skipping the entire aws-config tree absorbs every transitive dupe the
# smithy stack drags in (hyper, h2, http, http-body, socket2, ring's
# getrandom v0.2, aws-smithy-http itself). Re-evaluate after each
# aws-config / aws-sdk-* / aws-smithy-* bump.
skip-tree = [
    { name = "aws-config", reason = "smithy hyper v0.x/v1 split — track upstream" },
]

# -----------------------------------------------------------------------------
# Advisories (RustSec)
# -----------------------------------------------------------------------------
[advisories]
version = 2
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
yanked = "warn"
ignore = []

# -----------------------------------------------------------------------------
# Sources
# -----------------------------------------------------------------------------
[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
